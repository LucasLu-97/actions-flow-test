name: release

# 推送 v* 标签即触发（也可手动触发用于测试构建，不发版）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 发布 Release 必需，否则上传资产会 403（常见坑）
permissions:
  contents: write

# 同一个标签/分支重复触发时，取消还在排队跑的旧任务，避免浪费额度与时间
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 防止异常时无限挂机烧时间
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成构建产物
        run: |
          mkdir -p dist
          cat > dist/build-info.txt <<EOF
          仓库: ${{ github.repository }}
          标签: ${{ github.ref_name }}
          提交: ${{ github.sha }}
          构建时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Runner: ${{ runner.os }}
          EOF
          cd dist
          zip build-info.zip build-info.txt
          sha256sum build-info.zip > build-info.zip.sha256
          cat build-info.zip.sha256

      # 仅标签触发时发布；手动触发只跑构建，方便验证流程而不产生垃圾 Release
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/build-info.zip
            dist/build-info.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
