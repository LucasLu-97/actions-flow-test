name: android-release

# 推送 v* 标签触发云端构建 APK 并发版；手动触发只构建不发版（用于验证缓存提速）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 首次构建约 5-10 分钟，缓存命中后 2-3 分钟；25 分钟是保险上限
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17（AGP 8.x 最低要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 提速与避坑：ubuntu-latest Runner 镜像自带完整 Android SDK（/usr/local/lib/android/sdk，
      # licenses 已预接受）。不再使用 android-actions/setup-android —— 它默认要装已下架的旧
      # 'tools' 包，与新版 SDK 仓库不兼容会直接失败，且白费 1-2 分钟。缺失的平台组件 AGP 会自动下载。

      # Gradle 缓存由 setup-gradle 统一管理（依赖、wrapper、构建缓存一并缓存）
      - name: 安装 Gradle 并开启依赖缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 版本号由标签自动注入：v0.1.0 -> versionName 0.1.0，versionCode 用 run 序号，本地零修改
      - name: 构建 APK（仅 arm64-v8a）
        run: gradle assembleRelease --stacktrace --build-cache -PappVersionName="${GITHUB_REF_NAME#v}" -PappVersionCode=${GITHUB_RUN_NUMBER}

      - name: 整理产物
        run: |
          cd app/build/outputs/apk/release
          APK="flow-test-${GITHUB_REF_NAME}-arm64-v8a-unsigned.apk"
          cp app-release-unsigned.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          ls -la

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/flow-test-*.apk
            app/build/outputs/apk/release/flow-test-*.sha256
          fail_on_unmatched_files: true
